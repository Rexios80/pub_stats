name: Deploy to Firebase
on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: |
          dart pub get
          npm ci --prefix functions

      - name: Write credentials
        env:
          CREDENTIALS_OPS: ${{ secrets.CREDENTIALS_OPS }}
        run: printf '%s\n' "$CREDENTIALS_OPS" > pub_stats_collector/lib/credential/credentials.ops.dart

      - name: Build functions
        working-directory: functions
        run: dart run tool/build.dart

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/602612349235/locations/global/workloadIdentityPools/github/providers/pub-stats
          service_account: github-action-441530706@pub-stats-collector.iam.gserviceaccount.com

      - name: Deploy functions
        run: npx --yes firebase-tools@15.34.0 deploy --only functions --project pub-stats-collector --non-interactive
