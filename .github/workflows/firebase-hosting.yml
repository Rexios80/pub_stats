name: Deploy to Firebase Hosting on merge
"on":
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub global activate jaspr_cli 0.23.5
      - run: dart pub get
      - run: jaspr build
        working-directory: pub_stats
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/602612349235/locations/global/workloadIdentityPools/github/providers/pub-stats
          service_account: github-action-441530706@pub-stats-collector.iam.gserviceaccount.com
      - run: npx --yes firebase-tools@15.34.0 deploy --only hosting:pub-stats-collector --project pub-stats-collector --non-interactive
